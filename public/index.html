<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFlow - Migration MVP</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a30;
        --text: #eef3ff;
        --muted: #a9b3cc;
        --accent: #6b8cff;
        --line: rgba(255, 255, 255, 0.12);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; color: var(--text); background: var(--bg); }
      .container { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
      header, footer { border-bottom: 1px solid var(--line); padding: 16px 0; }
      footer { border-top: 1px solid var(--line); border-bottom: none; margin-top: 24px; }
      .hero { padding: 38px 0 18px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
      .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      a { color: #9fb7ff; }
      @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div class="container"><strong id="siteName">DocFlow</strong> · <span id="tagline">加载中...</span></div>
    </header>

    <main class="container">
      <section class="hero card">
        <h1 id="heroTitle">加载中...</h1>
        <p class="muted" id="heroDescription"></p>
        <p>
          <a id="primaryCta" href="/health">健康检查</a> ·
          <a id="secondaryCta" href="/api/content">内容 API</a>
        </p>
      </section>

      <section>
        <h2>栏目</h2>
        <div id="sections"></div>
      </section>

      <section>
        <h2>页面与文章</h2>
        <div class="grid">
          <div class="card">
            <h3>Pages</h3>
            <ul id="pages"></ul>
          </div>
          <div class="card">
            <h3>Posts</h3>
            <ul id="posts"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container muted">WordPress Migration MVP · Node.js</div>
    </footer>

    <script>
      const renderList = (id, items) => {
        const el = document.getElementById(id);
        el.innerHTML = '';
        if (!items || items.length === 0) {
          el.innerHTML = '<li class="muted">暂无内容</li>';
          return;
        }
        items.slice(0, 10).forEach((item) => {
          const li = document.createElement('li');
          li.textContent = `${item.title} - ${item.excerpt || ''}`;
          el.appendChild(li);
        });
      };

      fetch('/api/content')
        .then((r) => r.json())
        .then((data) => {
          document.getElementById('siteName').textContent = data.siteName || 'DocFlow';
          document.getElementById('tagline').textContent = data.tagline || '';
          document.getElementById('heroTitle').textContent = data.heroTitle || '';
          document.getElementById('heroDescription').textContent = data.heroDescription || '';

          const primary = document.getElementById('primaryCta');
          primary.textContent = data?.primaryCta?.label || '健康检查';
          primary.href = data?.primaryCta?.href || '/health';

          const secondary = document.getElementById('secondaryCta');
          secondary.textContent = data?.secondaryCta?.label || '内容 API';
          secondary.href = data?.secondaryCta?.href || '/api/content';

          const sections = document.getElementById('sections');
          sections.innerHTML = '';
          (data.sections || []).forEach((section) => {
            const card = document.createElement('article');
            card.className = 'card';
            const title = document.createElement('h3');
            title.textContent = section.title || '未命名栏目';
            card.appendChild(title);
            const ul = document.createElement('ul');
            (section.items || []).forEach((item) => {
              const li = document.createElement('li');
              li.textContent = item;
              ul.appendChild(li);
            });
            card.appendChild(ul);
            sections.appendChild(card);
          });

          renderList('pages', data.pages || []);
          renderList('posts', data.posts || []);
        })
        .catch(() => {
          document.getElementById('heroTitle').textContent = '无法读取内容数据';
          document.getElementById('heroDescription').textContent = '请先检查 /api/content 是否可访问。';
        });
    </script>
  </body>
</html>
