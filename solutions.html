    <main class="section container">
      <h1 class="page-title">解决方案</h1>
      <p class="lead">针对数据库生命周期的关键场景，我们提供可组合的服务能力。</p>

      <div class="cards">
        <article class="card">
          <h2>生产支持</h2>
          <p>7×24 支持，覆盖故障定位、应急恢复、根因分析与预防建议。</p>
        </article>
        <article class="card">
          <h2>性能优化</h2>
          <p>从 SQL、索引、参数与资源配置四层联动，降低延迟并提升吞吐。</p>
        </article>
        <article class="card">
          <h2>迁移升级</h2>
          <p>提供版本升级、异构迁移、双写验证、蓝绿发布与回滚演练。</p>
        </article>
        <article class="card">
          <h2>托管巡检</h2>
          <p>建立监控指标、告警策略、容量预测与月度健康报告机制。</p>
        </article>
      </div>

      <section id="contact" class="contact-inline">
        <h2>提交需求</h2>
        <form class="contact-form">
          <label>
            公司名称
            <input type="text" placeholder="例如：Acme Inc." />
          </label>
          <label>
            联系邮箱
            <input type="email" placeholder="you@company.com" />
          </label>
          <label>
            需求描述
            <textarea rows="4" placeholder="请描述当前数据库挑战"></textarea>
          </label>
          <button type="submit" class="btn">提交咨询</button>
        </form>
      </section>
